<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в кабинет менеджера</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <span id="companyName" class="brand-name">Менеджер</span>
            <span class="brand-subtitle">Вход в кабинет</span>
        </div>

        <div id="configError" class="notice notice-error" role="alert" hidden></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" autofocus
                       placeholder="Введите пароль" required>
            </div>

            <div id="formError" class="notice notice-error" role="alert" hidden></div>

            <button type="submit" id="submitBtn">Войти</button>
        </form>
    </main>

    <script src="login.js" defer></script>
</body>
</html>
